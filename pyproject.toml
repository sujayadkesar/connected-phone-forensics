[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "connected-phone-forensics"
dynamic = ["version"]
description = "Recover smartphone evidence from the computers a phone was connected to."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "licenses/*"]
requires-python = ">=3.10"
authors = [{ name = "Connected Phone Forensics contributors" }]
keywords = ["dfir", "digital-forensics", "mobile-forensics", "incident-response", "iphone", "android",
            "phone-link", "usb", "bluetooth", "kape", "velociraptor", "timesketch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "regipy>=4.0",
    "PySide6-Essentials>=6.6",
    "qtawesome>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pypdf>=4", "tzdata; sys_platform == 'win32'"]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/sujayadkesar/connected-phone-forensics"
Documentation = "https://github.com/sujayadkesar/connected-phone-forensics#readme"
Releases = "https://github.com/sujayadkesar/connected-phone-forensics/releases"
Issues = "https://github.com/sujayadkesar/connected-phone-forensics/issues"
Changelog = "https://github.com/sujayadkesar/connected-phone-forensics/blob/main/CHANGELOG.md"

[project.scripts]
cpf = "connected_phone_forensics.cli:main"
connected-phone-forensics = "connected_phone_forensics.cli:main"

[project.gui-scripts]
cpf-gui = "connected_phone_forensics.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "connected_phone_forensics.__version__" }

[tool.setuptools.packages.find]
include = ["connected_phone_forensics*"]

[tool.setuptools.package-data]
connected_phone_forensics = ["assets/*", "assets/ui/*/*", "assets/fonts/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
