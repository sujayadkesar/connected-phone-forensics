name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: Qt's system libraries differ on newer images.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check connected_phone_forensics tests
      - name: Report failing tests as annotations
        run: python -m pip install pytest-github-actions-annotate-failures
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -rfE 2>&1 | tee pytest.log
      - name: Show the end of a failed test run
        # A crash (for example in Qt) leaves no per-test annotation; this puts the last lines of
        # the run where everyone can read them.
        if: failure()
        shell: bash
        run: |
          tail -c 5000 pytest.log | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=Last lines of the test run::' + t)"
      - name: CLI smoke test
        run: |
          cpf --version
          cpf plugins
          cpf targets --format kape
          cpf docs -o artifacts.md
