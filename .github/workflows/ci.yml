name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"  # a crash must not take the end of the log with it
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: Qt's system libraries differ on newer images.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check connected_phone_forensics tests
      - name: Report failing tests as annotations
        run: python -m pip install pytest-github-actions-annotate-failures
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -rfE 2>&1 | tee pytest.log
      - name: Summarise a failed test run
        # Job logs need a sign-in; annotations do not. Put the failing tests, their assertion
        # messages, any crash report and the last lines where everyone can read them.
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re
          lines = open("pytest.log", encoding="utf-8", errors="replace").read().splitlines()
          def emit(title, body):
              body = body[-6000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{body}")
          failed = [ln for ln in lines if re.match(r"(FAILED|ERROR) ", ln)]
          if failed:
              emit("Failed tests", "\n".join(failed[:40]))
          messages = [ln for ln in lines if ln.startswith("E ")]
          if messages:
              emit("Assertion messages", "\n".join(messages[:80]))
          crash = next((n for n, ln in enumerate(lines) if "Fatal Python error" in ln or "fatal exception" in ln), None)
          if crash is not None:
              emit("Crash", "\n".join(lines[crash:crash + 60]))
          emit("Last lines of the test run", "\n".join(lines[-40:]))
          EOF
      - name: CLI smoke test
        run: |
          cpf --version
          cpf plugins
          cpf targets --format kape
          cpf docs -o artifacts.md
