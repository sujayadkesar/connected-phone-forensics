name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Desktop app dependencies (GUI tests run headless; skipped on Linux)
        if: runner.os != 'Linux'
        run: python -m pip install -e ".[gui]"
      - run: python -m ruff check connected_phone_forensics tests
      - run: python -m pytest
      - name: CLI smoke test
        run: |
          cpf --version
          cpf plugins
          cpf targets --format kape
          cpf docs -o artifacts.md
